name: Monitoramento editorial EuvouserDoutor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: editorial-monitor
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  monitor-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout do site existente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Monitorar fila editorial
        run: node scripts/editorial-queue.mjs

      - name: Validar build do site
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Abrir ou atualizar PR da fila editorial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/editorialQueue.json reports/editorial-queue-latest.md; then
            echo 'Nenhuma pauta nova encontrada.'
            exit 0
          fi
          git config user.name 'EuvouserDoutor Editorial Bot'
          git config user.email 'editorial-bot@euvouserdoutor.com'
          git checkout -B bot/editorial-queue
          git add src/editorialQueue.json reports/editorial-queue-latest.md
          git commit -m 'chore(editorial): atualizar fila de pautas'
          git push --force origin bot/editorial-queue
          PR_URL=$(gh pr list --head bot/editorial-queue --base main --json url --jq '.[0].url')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create --base main --head bot/editorial-queue --title 'Fila editorial automática' --body 'Fila de pautas descobertas automaticamente. Cada item permanece pendente de apuração primária e não é publicado como notícia sem verificação editorial.')
          fi
          gh pr merge "$PR_URL" --auto --squash --delete-branch=false || echo 'Auto-merge aguardando checks obrigatórios.'
