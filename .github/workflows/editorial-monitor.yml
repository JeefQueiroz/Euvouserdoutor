name: Monitoramento editorial EuvouserDoutor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: editorial-monitor
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  monitor-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do site existente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar branch editorial
        shell: bash
        run: |
          git fetch origin main
          if git ls-remote --exit-code --heads origin bot/editorial-review >/dev/null 2>&1; then
            git fetch origin bot/editorial-review
            git switch --force-create bot/editorial-review origin/bot/editorial-review
            git rebase origin/main
          else
            git switch --create bot/editorial-review origin/main
          fi

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Validar automação
        run: pnpm test

      - name: Monitorar fila editorial
        id: monitor
        shell: bash
        run: |
          node scripts/editorial-queue.mjs
          if git diff --quiet -- src/editorialQueue.json reports/editorial-queue-latest.md; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Validar build do site
        if: steps.monitor.outputs.changed == 'true'
        run: pnpm build

      - name: Abrir ou atualizar PR da fila editorial
        if: steps.monitor.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name 'EuvouserDoutor Editorial Bot'
          git config user.email 'editorial-bot@euvouserdoutor.com'
          git add src/editorialQueue.json reports/editorial-queue-latest.md
          git commit -m 'chore(editorial): atualizar fila de pautas'
          git push origin HEAD:bot/editorial-review
          PR_URL=$(gh pr list --head bot/editorial-review --base main --state open --json url --jq '.[0].url')
          if [ -z "$PR_URL" ]; then
            gh pr create --base main --head bot/editorial-review --title 'Fila editorial automática' --body 'Fila de pautas descobertas automaticamente. Cada item permanece pendente de apuração primária e exige revisão humana antes do merge.'
          fi
